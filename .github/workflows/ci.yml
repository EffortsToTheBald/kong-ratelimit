# Gate 6 task 5: CI (.github/workflows/ci.yml)
#
# Design principles (Gate 6 constraints):
# 1. Cover only test entry points that actually exist in the repo (test/*.sh and bench/quota.sh), no fabrication;
# 2. Pin image versions (docker-compose.yml: kong:3.6 / redis:7-alpine / hashicorp/http-echo:1.0);
#    do not use docker-compose.mirror.yml (the external mirror registry is for manual domestic-network troubleshooting only, see docs/docker-mirror.md);
# 3. Run all tests serially and aggregate failures; never manufacture green by skipping core tests;
# 4. No full performance matrix — reasons:
#    - bench/matrix.sh (Phase 7 scope) is a long-duration load test (multiple groups × 20s+ warmup); host noise on shared GitHub Runners
#      invalidates p99 attribution (Phase 7 recorded ~4s periodic noise), so the numbers are untrustworthy;
#    - long-stability/memory curves (>24h) and real cross-machine RTT verification need a dedicated environment (NOT VERIFIED maintained);
#    - the k6 latency load test has the same problem.
#    Bench coverage in CI is quota.sh (quota correctness, seconds-scale).

name: ci

on:
  push:
    branches: [master, remediation/hardening]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Start compose stack (fixed image versions from docker-compose.yml)
        run: |
          docker compose version
          docker compose up -d
          for i in $(seq 1 60); do
            curl -fsS --max-time 2 http://localhost:8031/status >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS --max-time 5 http://localhost:8031/status
          docker compose exec -T redis redis-cli ping

      - name: Lua syntax check (luajit -bl, all plugin + script sources)
        run: |
          set -e
          FILES=$(find kong/plugins/rate-limit-advanced redis -name '*.lua' | sort)
          for f in $FILES; do
            docker compose cp "$f" kong1:/tmp/syn.lua >/dev/null
            docker compose exec -T kong1 luajit -bl /tmp/syn.lua >/dev/null
            echo "syntax ok: $f"
          done

      - name: Script dual-source consistency check
        run: bash test/script-consistency-check.sh

      - name: Unit tests (resty protocol level)
        run: |
          set -e
          for t in lease-unit algorithm-lease-unit config-isolation-unit evalsha-unit; do
            echo "=== $t ==="; bash test/$t.sh
          done

      - name: Redis integration (bare redis-cli matrix + smoke)
        run: |
          set -e
          bash test/lease-redis-matrix.sh
          bash test/lease-grant-smoke.sh

      - name: Kong E2E suite (real OpenResty workers, serial, fail-aggregated)
        run: |
          declare -A RESULT
          for t in algorithm-lease-e2e lease-exhaustion-e2e config-isolation-e2e \
                   lease-timeout-uncertain-e2e fault-recovery-e2e handler-fault-e2e \
                   script-cache-selfheal-e2e worker-crash-e2e lease-isolation \
                   concurrent-lease-e2e redis-password-e2e; do
            echo "=== $t ==="
            if bash "test/$t.sh"; then RESULT[$t]=PASS; else RESULT[$t]=FAIL; fi
          done
          echo "===== E2E summary ====="
          fail=0
          for t in "${!RESULT[@]}"; do
            echo "$t: ${RESULT[$t]}"
            [ "${RESULT[$t]}" = "PASS" ] || fail=1
          done
          exit $fail

      - name: bench/quota.sh (quota correctness, 3-node shared pool)
        run: |
          # k6 version rationale: quota.js uses the ES2020 optional chaining operator (?.), unsupported by
          # babel in k6 <0.52 (grafana/k6#2168); natively supported by default mode in v0.53+ (official release notes).
          # Pinned to v0.57.0 (release assets verified).
          curl -sL -o /tmp/k6.tar.gz \
            https://github.com/grafana/k6/releases/download/v0.57.0/k6-v0.57.0-linux-amd64.tar.gz
          tar -C /tmp -xzf /tmp/k6.tar.gz
          sudo install /tmp/k6-v0.57.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version
          bash bench/quota.sh -l 100 -b 1 -p 150
