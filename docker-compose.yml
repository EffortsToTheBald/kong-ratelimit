# 3 个 Kong 副本（DB-less）+ Redis + 极轻的上游，用于验证"多副本共享配额"
#
# 端口规划：
#   kong1  代理 8030  管理 8031
#   kong2  代理 8010  管理 8011
#   kong3  代理 8020  管理 8021
#   redis  6380（宿主机）→ 6379（容器内）
#   echo   5678
#
# 为什么 kong1 不是 8000：Windows 侧的 IP Helper(iphlpsvc) 会占用 0.0.0.0:8000，
# 而 WSL 若是 mirrored 网络模式（.wslconfig 里 networkingMode=mirrored），
# 端口空间与 Windows 共用，容器就绑不上 8000。换 8030 即可，不影响容器间通信。
#
# 没有前置负载均衡：客户端轮询三个端口，这样"请求打到哪个节点"是确定的，
# 出问题时能一眼看出是节点问题还是配额问题。

x-kong-common: &kong-common
  image: kong:3.6
  restart: unless-stopped
  environment:
    KONG_DATABASE: "off"
    KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
    KONG_PLUGINS: "bundled,rate-limit-advanced"
    KONG_LOG_LEVEL: notice
    KONG_PROXY_ACCESS_LOG: /dev/stdout
    KONG_ADMIN_ACCESS_LOG: /dev/stdout
    KONG_PROXY_ERROR_LOG: /dev/stderr
    KONG_ADMIN_ERROR_LOG: /dev/stderr
    KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    # 固定 worker 数，让压测/诊断行为可复现（否则随机器核数变化）
    KONG_NGINX_WORKER_PROCESSES: "2"
  volumes:
    - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    - ./kong/plugins/rate-limit-advanced:/usr/local/share/lua/5.1/kong/plugins/rate-limit-advanced:ro
  depends_on:
    redis:
      condition: service_healthy
    echo:
      condition: service_started

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      # 宿主机 6379 常见被本地 redis-server 占用，故映射到 6380；
      # 容器之间仍通过服务名 redis:6379 通信，不受影响。
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  echo:
    image: hashicorp/http-echo:1.0
    restart: unless-stopped
    command: ["-listen=:5678", "-text=ok"]
    ports:
      - "5678:5678"

  kong1:
    <<: *kong-common
    container_name: kong1
    ports:
      - "8030:8000"
      - "8031:8001"

  kong2:
    <<: *kong-common
    container_name: kong2
    ports:
      - "8010:8000"
      - "8011:8001"

  kong3:
    <<: *kong-common
    container_name: kong3
    ports:
      - "8020:8000"
      - "8021:8001"
